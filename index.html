<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080A" />
    <title>%VITE_PROFILE_NAME% | Full-Stack Engineer for Hire</title>
    <meta name="description" content="Full-stack engineer building web applications end to end with Python, Django, FastAPI, Angular, React, PostgreSQL and OpenSearch. Available for freelance projects." />
    <meta property="og:title" content="%VITE_PROFILE_NAME% | Full-Stack Engineer for Hire" />
    <meta property="og:description" content="Web applications built end to end, from database schema to interface. Django, FastAPI, Angular, React, PostgreSQL, OpenSearch." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Lets Netlify Forms detect the inquiry form at deploy time. The visible form is rendered by React. -->
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <!-- Static copy of the inquiry form so Netlify Forms can detect it at deploy time -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="type" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
